<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#FAF9F7"/>
  <rect x="0.5" y="0.5" width="799" height="449" stroke="#E4DDE0"/>
  <defs>
    <pattern id="grid-citysim" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(109, 31, 43, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid-citysim)"/>

  <!-- Top Bar -->
  <rect x="40" y="30" width="720" height="36" rx="6" fill="#FFFFFF" stroke="#E4DDE0"/>
  <circle cx="62" cy="48" r="4" fill="#6D1F2B" opacity="0.4"/>
  <circle cx="76" cy="48" r="4" fill="#8A2C3B" opacity="0.6"/>
  <circle cx="90" cy="48" r="4" fill="#6D1F2B" opacity="0.9"/>
  <text x="110" y="52" fill="#625C5F" font-family="monospace" font-size="11">City-Simulation // urban-grid-agent-pathfinding.js</text>
  <text x="660" y="52" fill="#6D1F2B" font-family="monospace" font-size="11" font-weight="700">● 60 FPS SIM</text>

  <!-- Left: City Grid Mesh -->
  <rect x="60" y="90" width="310" height="265" rx="8" fill="#FFFFFF" stroke="#E4DDE0"/>
  <rect x="75" y="105" width="130" height="20" rx="4" fill="#F3E8EA"/>
  <text x="83" y="119" fill="#6D1F2B" font-family="monospace" font-size="10" font-weight="700">URBAN GRID ENGINE</text>
  
  <!-- Mini city grid layout -->
  <rect x="100" y="145" width="45" height="45" rx="3" fill="#FAF9F7" stroke="#6D1F2B"/>
  <rect x="155" y="145" width="45" height="45" rx="3" fill="#FAF9F7" stroke="#6D1F2B"/>
  <rect x="210" y="145" width="45" height="45" rx="3" fill="#F3E8EA" stroke="#6D1F2B"/>
  <rect x="265" y="145" width="45" height="45" rx="3" fill="#FAF9F7" stroke="#6D1F2B"/>

  <rect x="100" y="200" width="45" height="45" rx="3" fill="#F3E8EA" stroke="#6D1F2B"/>
  <rect x="155" y="200" width="45" height="45" rx="3" fill="#FAF9F7" stroke="#6D1F2B"/>
  <rect x="210" y="200" width="45" height="45" rx="3" fill="#FAF9F7" stroke="#6D1F2B"/>
  <rect x="265" y="200" width="45" height="45" rx="3" fill="#FAF9F7" stroke="#6D1F2B"/>

  <!-- Path -->
  <path d="M 122 167 L 232 167 L 232 222 L 287 222" stroke="#6D1F2B" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="287" cy="222" r="4" fill="#6D1F2B"/>

  <text x="75" y="325" fill="#191719" font-family="monospace" font-size="11" font-weight="600">A* Pathfinding: 120 Autonomous Agents</text>
  <text x="75" y="342" fill="#625C5F" font-family="monospace" font-size="10">Traffic flow collision: 0 incidents</text>

  <!-- Right: Simulation Dynamics -->
  <rect x="400" y="90" width="340" height="265" rx="8" fill="#FFFFFF" stroke="#E4DDE0"/>
  <rect x="415" y="105" width="130" height="20" rx="4" fill="#F3E8EA"/>
  <text x="423" y="119" fill="#6D1F2B" font-family="monospace" font-size="10" font-weight="700">DYNAMICS SPECS</text>
  
  <rect x="415" y="140" width="310" height="36" rx="4" fill="#FAF9F7" stroke="#E4DDE0"/>
  <text x="425" y="163" fill="#625C5F" font-family="monospace" font-size="11">Rendering: HTML5 Canvas 2D / WebGL</text>

  <rect x="415" y="185" width="310" height="36" rx="4" fill="#FAF9F7" stroke="#E4DDE0"/>
  <text x="425" y="208" fill="#625C5F" font-family="monospace" font-size="11">Zone Types: Commercial, Residential, Park</text>

  <rect x="415" y="230" width="310" height="36" rx="4" fill="#FAF9F7" stroke="#E4DDE0"/>
  <text x="425" y="253" fill="#625C5F" font-family="monospace" font-size="11">Congestion Heatmap Simulation</text>

  <rect x="415" y="275" width="310" height="36" rx="4" fill="#F3E8EA" stroke="#6D1F2B"/>
  <text x="425" y="298" fill="#6D1F2B" font-family="monospace" font-size="11" font-weight="700">Tick Rate: 60Hz deterministic loop</text>

  <!-- Bottom Bar -->
  <rect x="40" y="380" width="720" height="36" rx="6" fill="#FFFFFF" stroke="#E4DDE0"/>
  <text x="60" y="403" fill="#8A8285" font-family="monospace" font-size="11">ENGINE METRICS:</text>
  <text x="180" y="403" fill="#191719" font-family="monospace" font-size="11">Stack: <tspan fill="#6D1F2B" font-weight="700">JavaScript / Canvas</tspan></text>
  <text x="400" y="403" fill="#191719" font-family="monospace" font-size="11">Grid Cells: <tspan fill="#6D1F2B" font-weight="700">64x64</tspan></text>
  <text x="580" y="403" fill="#191719" font-family="monospace" font-size="11">Source: <tspan fill="#6D1F2B" font-weight="700">Open Source</tspan></text>
</svg>
