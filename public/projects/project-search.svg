  <text x="110" y="57" fill="#625C5F" font-family="monospace" font-size="11">neural-code-search // ast-vector-indexer</text>
  <text x="660" y="57" fill="#6D1F2B" font-family="monospace" font-size="11" font-weight="700">● 1.2M NODES</text>

  <!-- AST Hierarchy Graphic -->
  <rect x="60" y="100" width="680" height="250" rx="8" fill="#FFFFFF" stroke="#E4DDE0"/>
  
