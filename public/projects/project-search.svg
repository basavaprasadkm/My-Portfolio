  <line x1="240" y1="232" x2="320" y2="275" stroke="#E4DDE0" stroke-width="1"/>
  <line x1="560" y1="232" x2="480" y2="275" stroke="#E4DDE0" stroke-width="1"/>
  <line x1="560" y1="232" x2="640" y2="275" stroke="#E4DDE0" stroke-width="1"/>

  <rect x="110" y="275" width="100" height="26" rx="4" fill="#FAF9F7" stroke="#E4DDE0"/>
  <text x="122" y="292" fill="#6D1F2B" font-family="monospace" font-size="10">vec[0..768]</text>

  <rect x="270" y="275" width="100" height="26" rx="4" fill="#FAF9F7" stroke="#E4DDE0"/>
  <text x="282" y="292" fill="#6D1F2B" font-family="monospace" font-size="10">vec[0..768]</text>

  <rect x="430" y="275" width="100" height="26" rx="4" fill="#FAF9F7" stroke="#E4DDE0"/>
  <text x="442" y="292" fill="#6D1F2B" font-family="monospace" font-size="10">vec[0..768]</text>

  <rect x="590" y="275" width="100" height="26" rx="4" fill="#FAF9F7" stroke="#E4DDE0"/>
  <text x="602" y="292" fill="#6D1F2B" font-family="monospace" font-size="10">vec[0..768]</text>

  <!-- Bottom Bar -->
  <rect x="40" y="380" width="720" height="34" rx="6" fill="#FFFFFF" stroke="#E4DDE0"/>
  <text x="60" y="402" fill="#8A8285" font-family="monospace" font-size="11">PARSER SPEED:</text>
  <text x="180" y="402" fill="#191719" font-family="monospace" font-size="11">Throughput: <tspan fill="#6D1F2B" font-weight="700">4,200 LOC/s</tspan></text>
  <text x="380" y="402" fill="#191719" font-family="monospace" font-size="11">Chroma Search: <tspan fill="#6D1F2B" font-weight="700">12ms</tspan></text>
  <text x="560" y="402" fill="#191719" font-family="monospace" font-size="11">Languages: <tspan fill="#625C5F">TS, PY, GO, RUST</tspan></text>
