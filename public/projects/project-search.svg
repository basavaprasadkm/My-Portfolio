<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#0E1015"/>
  <rect x="0.5" y="0.5" width="799" height="449" stroke="rgba(255,255,255,0.08)"/>
  
  <defs>
    <pattern id="grid-search" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid-search)"/>

  <!-- Top Bar -->
  <rect x="40" y="35" width="720" height="36" rx="6" fill="#141721" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="62" cy="53" r="4" fill="#EF4444" opacity="0.7"/>
  <circle cx="76" cy="53" r="4" fill="#F59E0B" opacity="0.7"/>
  <circle cx="90" cy="53" r="4" fill="#10B981" opacity="0.7"/>
  <text x="110" y="57" fill="#71717A" font-family="monospace" font-size="11">neural-code-search // ast-vector-indexer</text>
  <text x="670" y="57" fill="#38BDF8" font-family="monospace" font-size="11">● 1.2M NODES</text>

  <!-- AST Hierarchy Graphic -->
  <rect x="60" y="100" width="680" height="250" rx="8" fill="#141721" stroke="rgba(255,255,255,0.08)"/>
  
  <!-- Root Node -->
  <rect x="340" y="125" width="120" height="32" rx="6" fill="#1F2433" stroke="#38BDF8"/>
  <text x="365" y="146" fill="#38BDF8" font-family="monospace" font-size="11">AST: Program</text>

  <!-- Level 2 Nodes -->
  <line x1="400" y1="157" x2="240" y2="200" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <line x1="400" y1="157" x2="560" y2="200" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <rect x="170" y="200" width="140" height="32" rx="6" fill="#181C28" stroke="rgba(255,255,255,0.15)"/>
  <text x="185" y="221" fill="#E4E4E7" font-family="monospace" font-size="11">FunctionDeclaration</text>

  <rect x="490" y="200" width="140" height="32" rx="6" fill="#181C28" stroke="rgba(255,255,255,0.15)"/>
  <text x="510" y="221" fill="#E4E4E7" font-family="monospace" font-size="11">ClassDeclaration</text>

  <!-- Level 3 Embeddings -->
  <line x1="240" y1="232" x2="160" y2="275" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="240" y1="232" x2="320" y2="275" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="560" y1="232" x2="480" y2="275" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="560" y1="232" x2="640" y2="275" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <rect x="110" y="275" width="100" height="26" rx="4" fill="#0F1117" stroke="rgba(56, 189, 248, 0.3)"/>
  <text x="122" y="292" fill="#71717A" font-family="monospace" font-size="10">vec[0..768]</text>

  <rect x="270" y="275" width="100" height="26" rx="4" fill="#0F1117" stroke="rgba(56, 189, 248, 0.3)"/>
  <text x="282" y="292" fill="#71717A" font-family="monospace" font-size="10">vec[0..768]</text>

  <rect x="430" y="275" width="100" height="26" rx="4" fill="#0F1117" stroke="rgba(56, 189, 248, 0.3)"/>
  <text x="442" y="292" fill="#71717A" font-family="monospace" font-size="10">vec[0..768]</text>

  <rect x="590" y="275" width="100" height="26" rx="4" fill="#0F1117" stroke="rgba(56, 189, 248, 0.3)"/>
  <text x="602" y="292" fill="#71717A" font-family="monospace" font-size="10">vec[0..768]</text>

  <!-- Bottom Bar -->
  <rect x="40" y="380" width="720" height="34" rx="6" fill="#12141D" stroke="rgba(255,255,255,0.05)"/>
  <text x="60" y="402" fill="#71717A" font-family="monospace" font-size="11">PARSER SPEED:</text>
  <text x="180" y="402" fill="#F4F4F5" font-family="monospace" font-size="11">Throughput: <tspan fill="#38BDF8">4,200 LOC/s</tspan></text>
  <text x="380" y="402" fill="#F4F4F5" font-family="monospace" font-size="11">Chroma Search: <tspan fill="#10B981">12ms</tspan></text>
  <text x="560" y="402" fill="#F4F4F5" font-family="monospace" font-size="11">Languages: <tspan fill="#38BDF8">TS, PY, GO, RUST</tspan></text>
</svg>
