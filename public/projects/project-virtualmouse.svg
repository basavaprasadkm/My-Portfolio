<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#FAF9F7"/>
  <rect x="0.5" y="0.5" width="799" height="449" stroke="#E4DDE0"/>
  <defs>
    <pattern id="grid-vmouse" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(109, 31, 43, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid-vmouse)"/>

  <!-- Top Bar -->
  <rect x="40" y="30" width="720" height="36" rx="6" fill="#FFFFFF" stroke="#E4DDE0"/>
  <circle cx="62" cy="48" r="4" fill="#6D1F2B" opacity="0.4"/>
  <circle cx="76" cy="48" r="4" fill="#8A2C3B" opacity="0.6"/>
  <circle cx="90" cy="48" r="4" fill="#6D1F2B" opacity="0.9"/>
  <text x="110" y="52" fill="#625C5F" font-family="monospace" font-size="11">virtual-mouse // hand-landmark-gesture-tracker.py</text>
  <text x="650" y="52" fill="#6D1F2B" font-family="monospace" font-size="11" font-weight="700">● 60 FPS REALTIME</text>

  <!-- Left: Hand Landmark Skeletal Mesh -->
  <rect x="60" y="90" width="320" height="265" rx="8" fill="#FFFFFF" stroke="#E4DDE0"/>
  <rect x="75" y="105" width="135" height="20" rx="4" fill="#F3E8EA"/>
  <text x="83" y="119" fill="#6D1F2B" font-family="monospace" font-size="10" font-weight="700">21 3D LANDMARKS</text>

  <!-- Hand schematic points -->
  <circle cx="220" cy="270" r="4" fill="#6D1F2B"/>
  <circle cx="170" cy="220" r="4" fill="#6D1F2B"/>
  <circle cx="190" cy="180" r="4" fill="#6D1F2B"/>
  <circle cx="220" cy="165" r="5" fill="#6D1F2B"/>
  <circle cx="250" cy="180" r="4" fill="#6D1F2B"/>
  <circle cx="270" cy="210" r="4" fill="#6D1F2B"/>
  <line x1="220" y1="270" x2="170" y2="220" stroke="#6D1F2B" stroke-width="1.5"/>
  <line x1="220" y1="270" x2="190" y2="180" stroke="#6D1F2B" stroke-width="1.5"/>
  <line x1="220" y1="270" x2="220" y2="165" stroke="#6D1F2B" stroke-width="2"/>
  <line x1="220" y1="270" x2="250" y2="180" stroke="#6D1F2B" stroke-width="1.5"/>
  <line x1="220" y1="270" x2="270" y2="210" stroke="#6D1F2B" stroke-width="1.5"/>
  
  <rect x="200" y="145" width="40" height="40" stroke="#6D1F2B" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
  <text x="75" y="325" fill="#191719" font-family="monospace" font-size="11" font-weight="600">Active Gesture: INDEX PINCH [CLICK]</text>
  <text x="75" y="342" fill="#625C5F" font-family="monospace" font-size="10">Smoothing: Kalman Filter (Zero jitter)</text>

  <!-- Right: Cursor Control Events -->
  <rect x="400" y="90" width="340" height="265" rx="8" fill="#FFFFFF" stroke="#E4DDE0"/>
  <rect x="415" y="105" width="130" height="20" rx="4" fill="#F3E8EA"/>
  <text x="423" y="119" fill="#6D1F2B" font-family="monospace" font-size="10" font-weight="700">OS EVENT DISPATCH</text>
  
  <rect x="415" y="140" width="310" height="36" rx="4" fill="#FAF9F7" stroke="#E4DDE0"/>
  <text x="425" y="163" fill="#625C5F" font-family="monospace" font-size="11">Mouse Coordinate: (X: 1420, Y: 840)</text>

  <rect x="415" y="185" width="310" height="36" rx="4" fill="#FAF9F7" stroke="#E4DDE0"/>
  <text x="425" y="208" fill="#625C5F" font-family="monospace" font-size="11">Scroll Velocity: 42 px/sec</text>

  <rect x="415" y="230" width="310" height="36" rx="4" fill="#FAF9F7" stroke="#E4DDE0"/>
  <text x="425" y="253" fill="#625C5F" font-family="monospace" font-size="11">Event: LEFT_MOUSE_DOWN</text>

  <rect x="415" y="275" width="310" height="36" rx="4" fill="#F3E8EA" stroke="#6D1F2B"/>
  <text x="425" y="298" fill="#6D1F2B" font-family="monospace" font-size="11" font-weight="700">Latency: 14ms touchless response</text>

  <!-- Bottom Bar -->
  <rect x="40" y="380" width="720" height="36" rx="6" fill="#FFFFFF" stroke="#E4DDE0"/>
  <text x="60" y="403" fill="#8A8285" font-family="monospace" font-size="11">TRACKER SPECS:</text>
  <text x="180" y="403" fill="#191719" font-family="monospace" font-size="11">Engine: <tspan fill="#6D1F2B" font-weight="700">MediaPipe + OpenCV</tspan></text>
  <text x="410" y="403" fill="#191719" font-family="monospace" font-size="11">CPU Usage: <tspan fill="#6D1F2B" font-weight="700">&lt; 4%</tspan></text>
  <text x="590" y="403" fill="#191719" font-family="monospace" font-size="11">OS: <tspan fill="#6D1F2B" font-weight="700">Windows/Linux/Mac</tspan></text>
</svg>
